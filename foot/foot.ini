[main]
dpi-aware=no
initial-window-size-chars=80x24
font=CaskaydiaCove Nerd Font Mono:size=17
bold-text-in-bright=no
resize-keep-grid=no
selection-target=clipboard

[colors-dark]
background=000000
alpha=0.8

[mouse]
hide-when-typing=yes

[csd]
size=0
font=CaskaydiaCove Nerd Font Mono:weight=bold
hide-when-maximized=yes
border-width=2
border-color=ff191919
button-width=32
